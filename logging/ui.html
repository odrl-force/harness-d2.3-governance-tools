<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who asked for your meter readings</title>
<style>
  :root { --text: #000; --muted: #444; --line: #ddd; --bg: #fff; --accent: #0072B2; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: var(--text); background: var(--bg);
         max-width: 46rem; margin: 0 auto; padding: 2rem 16px 4rem; line-height: 1.5; font-size: 17px; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
  p.lead { color: var(--muted); margin: 0 0 2rem; }
  section.attempt { border-top: 1px solid var(--line); padding: 1.25rem 0; }
  section.attempt h2 { font-size: 1.1rem; margin: 0 0 .5rem; }
  .outcome-granted { color: var(--accent); font-weight: 700; }
  ol { margin: .25rem 0 0; padding-left: 1.25rem; }
  li { margin: .2rem 0; }
  .small { color: var(--muted); font-size: .9rem; }
  .chain { margin: 0 0 2rem; }
  label { font-weight: 700; }
  select { font: inherit; padding: .2rem; }
</style>
</head>
<body>
<h1>Who asked for your meter readings</h1>
<p class="lead">Each request, what was decided and why, newest first. Your own actions are listed as well.</p>
<p class="chain" id="chain">Checking the log…</p>
<p class="chain" id="refused" hidden></p>
<p><label for="who">Requests from</label>
  <select id="who"><option value="">all parties</option></select></p>
<div id="list"></div>
<script>
const NAMES = {
  'http://localhost:3000/anna/profile/card#me': 'Anna (you)',
  'http://localhost:3000/ghent/profile/card#me': 'City of Ghent',
  'http://localhost:3000/enerco/profile/card#me': 'EnerCo',
  'http://localhost:3000/other/profile/card#me': 'another party',
};
const PURPOSES = {
  ImprovePublicServices: 'improving public services', OptimisationForConsumer: 'advising you on your energy use',
  Marketing: 'marketing', Advertising: 'advertising', PersonalisedAdvertising: 'personalised advertising',
  TargetedAdvertising: 'targeted advertising', DirectMarketing: 'direct marketing', CommercialPurpose: 'commercial purposes',
  ResearchAndDevelopment: 'research and development', ScientificResearch: 'scientific research',
};
const OWNER = 'http://localhost:3000/anna/profile/card#me';
const nameOf = (iri) => NAMES[iri] ?? iri;
const purposeOf = (iri) => PURPOSES[iri.split('#').pop()] ?? iri;
const RULES = {
  'p0-read': 'you may read your own readings',
  'policy-p0-anna-owner': 'you may store, change and read your own readings',
  'p1-permission': 'the City of Ghent may read your readings to improve public services, until 1 January 2028',
  'policy-p1-altruism-city': 'the City of Ghent may read your readings to improve public services, until 1 January 2028',
  'p2-permission': 'EnerCo may read your readings to advise you on your energy use, until 1 July 2027',
  'policy-p2-commercial-enerco': 'EnerCo may read your readings to advise you on your energy use, until 1 July 2027',
  'policy-p3-no-marketing': 'nobody may use your readings for marketing or advertising',
};
const ruleOf = (iri) => {
  const key = iri.split('/').pop();
  return RULES[key] ?? (key.startsWith('p3-no-') ? RULES['policy-p3-no-marketing'] : key);
};
const day = (t) => new Date(t).toLocaleDateString('en-GB', { dateStyle: 'medium' });
const clock = (t) => new Date(t).toLocaleTimeString('en-GB', { timeStyle: 'medium' });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// The sender's own time is kept apart from the server's; show it when they differ by more than a minute.
const claimed = (e) => e.time && e.recordedAt && Math.abs(new Date(e.time) - new Date(e.recordedAt)) > 60_000
  ? ` <span class="small">(the sender gives ${day(e.time)}, ${clock(e.time)})</span>` : '';

function sentence(e) {
  const who = esc(nameOf(e.requester ?? ''));
  switch (e.type) {
    case 'PolicyCreated': return `You added a rule: ${esc(ruleOf(e.policy?.id ?? ''))}.`;
    case 'PolicyRemoved': return `You removed a rule: ${esc(ruleOf(e.policy?.id ?? ''))}.`;
    case 'AccessRequested':
      if (e.requester === OWNER) return `You asked to ${e.action?.endsWith('write') ? 'store new readings' : 'read your readings'}.`;
      return `${who} asked to ${e.action?.endsWith('write') ? 'change' : 'read'} the data`
      + (e.purposes?.length ? ` for ${e.purposes.map(purposeOf).map(esc).join(' and ')}.` : ', without saying why.');
    case 'DecisionMade': {
      const d = e.decision === 'granted' ? '<span class="outcome-granted">Allowed</span>' : e.decision === 'need_info' ? 'More information asked' : 'Refused';
      let rules = '';
      if (e.rules?.length) rules = ` Your rule: ${[...new Set(e.rules.map(ruleOf))].map(esc).join('; ')}.`;
      else if (e.decision !== 'granted') rules = ' No rule allows this request.';
      if (e.requester === OWNER) rules = '';
      const warn = (e.note ?? '').includes('MISMATCH') ? ' <strong>Warning: this decision does not match your rules.</strong>' : '';
      return `${d}.${rules}${warn}`;
    }
    case 'DataAccessed':
      if (e.httpStatus >= 300) return `The pod answered ${e.httpStatus}.`;
      return e.action?.endsWith('write') ? 'The data was stored.' : `${who} received the data.`;
    default: return esc(e.type);
  }
}

async function load() {
  const [all, chain, refused] = await Promise.all([fetch('/events').then((r) => r.json()), fetch('/verify').then((r) => r.json()),
    fetch('/rejected?owner=' + encodeURIComponent(OWNER)).then((r) => r.json())]);
  // The log holds every owner's events; this page shows only Anna's.
  const events = all.filter((e) => e.owner === OWNER);
  document.getElementById('chain').textContent = chain.ok
    ? `${events.length} entries. None has been changed or removed since it was written.`
    : `Warning: entry ${chain.brokenAt} has been changed or removed after it was written.`;
  const r = document.getElementById('refused');
  r.hidden = refused.length === 0;
  r.textContent = `${refused.length} ${refused.length === 1 ? 'entry naming you was' : 'entries naming you were'} refused because they were malformed. They are kept apart and not shown here.`;
  const sel = document.getElementById('who');
  for (const r of [...new Set(events.map((e) => e.requester).filter(Boolean))]) {
    if (![...sel.options].some((o) => o.value === r)) sel.add(new Option(nameOf(r), r));
  }
  const groups = new Map();
  for (const e of events) {
    if (sel.value && e.requester && e.requester !== sel.value) continue;
    if (sel.value && !e.requester && sel.value !== OWNER) continue;
    if (!groups.has(e.correlation)) groups.set(e.correlation, []);
    groups.get(e.correlation).push(e);
  }
  const html = [...groups.entries()].reverse().map(([id, list]) => {
    const first = list[0];
    const mine = id === 'setup' || first.requester === OWNER;
    const title = `${mine ? 'Your actions' : esc(nameOf(first.requester ?? ''))}, ${day(first.recordedAt ?? first.time)}`;
    return `<section class="attempt"><h2>${title}</h2><ol>${list.map((e) => `<li>${sentence(e)} <span class="small">${clock(e.recordedAt ?? e.time)}</span>${claimed(e)}</li>`).join('')}</ol>`
      + `<p class="small">Recorded by ${esc(first.source)}${first.note && id !== 'setup' ? ': ' + esc(first.note) : ''}</p></section>`;
  }).join('');
  document.getElementById('list').innerHTML = html || '<p>Nothing yet.</p>';
}
document.getElementById('who').addEventListener('change', load);
load();
</script>
</body>
</html>
